# Publica o site no GitHub Pages sem baixar o submódulo privado `recursos/`
# (o build automático do Pages tenta clonar submódulos e falha em repositórios privados).
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/configure-pages@v5

      # Publica só o site: raiz (index.html que redireciona) + front-end/index.html + front-end/markdown/.
      # Arquivos de execução local (front-end/docker/, docker-compose.yml, Makefile) ficam de fora.
      - name: Montar o site
        run: |
          mkdir -p _site/front-end
          cp index.html .nojekyll _site/
          cp front-end/index.html _site/front-end/
          cp -r front-end/markdown _site/front-end/markdown

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
