server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/markdown text/plain;

    types { text/markdown md; }
    include /etc/nginx/mime.types;

    # Sem cache: edições nos .md e no index.html aparecem ao recarregar
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Não serve os arquivos de infraestrutura local
    location ~ ^/(docker|docker-compose\.yml|Makefile) { return 404; }
}
