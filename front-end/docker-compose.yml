# Front-end local: make -C front-end up  (ou, na raiz: make front)
# Abre em http://localhost:${PORTA:-8787}/
services:
  front-end:
    build: ./docker
    image: tjsp-front-end:local
    container_name: tjsp-front-end
    ports:
      - "${PORTA:-8787}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
